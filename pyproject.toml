[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.51.0",
    "mcp[cli]>=2.3.0",
    "openai>=3.31.0",
    "prompt-toolkit>=3.0.51",
    "python-dotenv>=1.1.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "mcp_client", "mcp_server"]
packages = ["core"]
